services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sap
      POSTGRES_PASSWORD: sap
      POSTGRES_DB: sapdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap -d sapdb"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mock-sap:
    build:
      context: .
      dockerfile: docker/mock-sap.Dockerfile
    environment:
      SAP_PORT: 4001
      SAP_FAILURE_RATE: "${SAP_FAILURE_RATE:-0}"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    environment:
      DATABASE_URL: "postgresql://sap:sap@postgres:5432/sapdb?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: "postgresql://sap:sap@postgres:5432/sapdb?schema=public"
      SAP_URL: "http://mock-sap:4001"
      API_PORT: 4000
      JWT_SECRET: "${JWT_SECRET:-local-dev-only-change-this-secret}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-sap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: "postgresql://sap:sap@postgres:5432/sapdb?schema=public"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      SAP_URL: "http://mock-sap:4001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mock-sap:
        condition: service_healthy
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:4000/api/v1}"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
